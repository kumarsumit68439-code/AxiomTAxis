<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<meta name='theme-color' content='#05060a'>
<title>Dashboard - AxiomTAxis</title>
<link rel='preconnect' href='https://fonts.googleapis.com'>
<link href='https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap' rel='stylesheet'>
<link rel='stylesheet' href='dashboard.css'>
<link rel='stylesheet' href='dashboard-extra.css'>
<style>
.user-chip{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.user-chip img{width:28px;height:28px;border-radius:50%;object-fit:cover}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--txt);padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.exit-btn{display:flex;align-items:center;gap:8px;width:100%;margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--mut);padding:9px 12px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.exit-btn:hover{border-color:#ef4444;color:#ef4444}
</style>
</head>
<body>
<div class='app'>
  <aside class='sidebar' id='sidebar'>
    <div class='side-brand'><span class='logo'>A</span><span>AxiomTAxis</span></div>
    <nav class='side-nav' id='sideNav'>
      <a href='#overview' class='nav-item active' data-panel='overview'><span class='ico'>🏠</span> Overview</a>
      <a href='#ai' class='nav-item' data-panel='ai'><span class='ico'>🧠</span> AI</a>
      <a href='#welcome' class='nav-item' data-panel='welcome'><span class='ico'>➡️</span> Join &amp; Left</a>
      <a href='#counting' class='nav-item' data-panel='counting'><span class='ico'>🔢</span> Counting</a>
      <a href='#level' class='nav-item' data-panel='level'><span class='ico'>⭐</span> Level</a>
      <a href='#ticket' class='nav-item' data-panel='ticket'><span class='ico'>🎫</span> Ticket</a>
      <a href='#verification' class='nav-item' data-panel='verification'><span class='ico'>✅</span> Verification</a>
      <a href='#logging' class='nav-item' data-panel='logging'><span class='ico'>📋</span> Logging</a>
      <a href='#music' class='nav-item' data-panel='music'><span class='ico'>🎵</span> Music</a>
      <a href='#trigger' class='nav-item' data-panel='trigger'><span class='ico'>⚡</span> Trigger</a>
      <a href='#suggestions' class='nav-item' data-panel='suggestions'><span class='ico'>💡</span> Suggestions</a>
      <a href='#yt' class='nav-item' data-panel='yt'><span class='ico'>▶️</span> YT Notification</a>
      <a href='#memes' class='nav-item' data-panel='memes'><span class='ico'>😄</span> Auto Memes</a>
      <a href='#automod' class='nav-item' data-panel='automod'><span class='ico'>🤖</span> Auto Moderation</a>
      <a href='#antinuke' class='nav-item' data-panel='antinuke'><span class='ico'>🛡️</span> Anti Nuke</a>
      <a href='#antiraid' class='nav-item' data-panel='antiraid'><span class='ico'>🛡️</span> Anti Raid</a>
      <a href='#uptime' class='nav-item' data-panel='uptime'><span class='ico'>⏱️</span> Uptime</a>
    </nav>
    <div class='side-foot'><a href='/?site' class='back'>← Website</a><button class='exit-btn' id='exitBtn' type='button'>🚪 Exit</button></div>
  </aside>

  <main class='main'>
    <header class='topbar'>
      <button class='menu-btn' id='menuBtn' aria-label='Menu'>☰</button>
      <div class='top-title' id='topTitle'>Overview</div>
      <div class='top-right'>
        <div class='user-chip' id='userChip'></div>
        <a class='btn alt invite-top' id='inviteTop' href='#' target='_blank' rel='noopener'>+ Add Bot</a>
        <select id='guildSelect' class='guild-select'><option value=''>Select server...</option></select>
        <button class='btn save-btn' id='saveBtn'>Save</button>
        <button class='btn-ghost' id='logoutBtn' type='button'>Logout</button>
      </div>
    </header>

    <div class='content' id='content'>
      <!-- panels loaded by dashboard.js; memes panel updated below in full file -->
      <p>Loading dashboard…</p>
    </div>
  </main>
</div>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<script src='models.js'></script>
<script src='config.js'></script>
<script src='dashboard.js'></script>
<script src='dashboard-profile.js'></script>
</body>
</html>
