<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05060a">
<title>Login — AxiomTAxis</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#05060a;--panel:#0e1018;--line:#1c2030;--txt:#f0f2f8;--mut:#8b93b2;--accent:#f97316;--accent2:#ea580c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif}
.card{width:min(400px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:36px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.logo{width:64px;height:64px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:28px;font-weight:800;color:#fff}
h1{margin:0 0 8px;font-size:22px;font-weight:800}
p{margin:0 0 24px;color:var(--mut);font-size:14.5px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 20px;border:0;border-radius:12px;background:#5865F2;color:#fff;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:wait}
.btn svg{width:22px;height:22px;fill:currentColor}
.err{color:#ef4444;font-size:13px;margin-top:14px;min-height:1.2em}
.back{display:inline-block;margin-top:20px;color:var(--mut);font-size:13px;text-decoration:none}
.back:hover{color:var(--accent)}
.note{margin-top:16px;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">A</div>
  <h1>Login with Discord</h1>
  <p>Sign in to view your servers, configure bot settings, and manage the dashboard.</p>
  <button class="btn" id="loginBtn" type="button">
    <svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.635-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/></svg>
    Authorize with Discord
  </button>
  <div class="err" id="err"></div>
  <p class="note">Session auto-saves. Refresh pe login dubara nahi aayega.</p>
  <a class="back" href="/">← Back to website</a>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  var cfg=window.AXIOM_CONFIG||{};
  var errEl=document.getElementById('err');
  var btn=document.getElementById('loginBtn');
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){
    errEl.textContent='Supabase not configured. Netlify env: SUPABASE_URL + SUPABASE_ANON_KEY';
    btn.disabled=true;return;
  }
  var supabase=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY,{
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  supabase.auth.getSession().then(function(res){
    if(res.data&&res.data.session) window.location.replace('/dashboard.html');
  });
  btn.onclick=async function(){
    errEl.textContent='';btn.disabled=true;btn.textContent='Redirecting…';
    var redirectTo=window.location.origin+'/dashboard.html';
    var r=await supabase.auth.signInWithOAuth({
      provider:'discord',
      options:{redirectTo:redirectTo,scopes:'identify email guilds'}
    });
    if(r.error){errEl.textContent=r.error.message||'Login failed';btn.disabled=false;btn.textContent='Authorize with Discord';}
  };
})();
</script>
</body>
</html>
